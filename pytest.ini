[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

# The CPU-only suite must stay fast enough to run on every edit. Anything that
# loads a transformer, touches the GPU, or reads a multi-hundred-MB artifact gets
# a marker so it can be excluded:
#   pytest -m "not slow and not gpu"     <- the green-on-every-edit suite
#   pytest                               <- everything
markers =
    slow: loads a model or a large artifact (seconds to minutes)
    gpu: requires CUDA; skipped on CPU-only machines
    needs_artifacts: requires experiments/results/* to be present on disk
    windows_only: native Windows integration; explicit platform skip retained

filterwarnings =
    ignore::DeprecationWarning:torch.jit._script
