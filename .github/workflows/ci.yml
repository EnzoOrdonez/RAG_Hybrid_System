name: CI

on:
  push:
    branches:
      - main
      - "summer/*"
  pull_request:
    branches:
      - main
      - "summer/*"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONHASHSEED: "42"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.21
          uv pip sync --system --torch-backend cpu --require-hashes requirements-app.txt
          uv pip check --system

      # informativo hasta post-entrega; no bloquea
      - name: Report Ruff findings
        continue-on-error: true
        run: |
          python -m pip install ruff==0.15.5
          python -m ruff check .

      - name: Scan repository for secrets
        run: python scripts/scan_secrets.py --baseline secrets_baseline.json

      - name: Run CPU-only test suite
        run: python -m pytest tests/ -q -m "not slow and not gpu"
