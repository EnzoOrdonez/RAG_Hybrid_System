name: CI

on:
  push:
    branches:
      - main
      - "summer/*"
  pull_request:
    branches:
      - main
      - "summer/*"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          # pytest is a CI dependency; requirements.txt remains the editable runtime source.
          python -m pip install pytest

      - name: Run CPU-only test suite
        run: python -m pytest tests/ -q -m "not slow and not gpu"
